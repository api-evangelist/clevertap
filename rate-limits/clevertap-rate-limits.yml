other_limits:
  - name: Upload batch size
    limit: 1000
    unit: records per request
    applies: /1/upload
    source: https://developer.clevertap.com/docs/upload-events-api
  - name: Webhook response timeout
    limit: 3
    unit: seconds
    applies: outbound webhooks
    note: >-
      CleverTap waits three seconds for the receiving endpoint to respond, then
      retries once; a second failure marks the campaign "Webhook Dispatch Failed".
    source: https://developer.clevertap.com/docs/webhooks
policies:
  - name: Exhaustion behavior
    description: >-
      Requests beyond the concurrency ceiling are rejected with HTTP 429 and the
      message "Too many concurrent requests". Because there is no window, the
      correct client behavior is to cap in-flight parallelism at the documented
      number rather than to pace by time.
  - name: No documented backoff contract
    description: >-
      CleverTap publishes no Retry-After value and no reset timestamp. Clients
      must implement their own backoff.
