specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CleverTap
providerId: clevertap
generated: '2026-08-13'
method: searched
source: https://developer.clevertap.com/docs/api-request-limit
created: '2026-05-04'
modified: '2026-08-13'
tags:
  - Rate Limiting
  - Quotas
  - Throttling
  - Concurrency
description: >-
  CleverTap's published API limits, read from its own API Request Limit page on
  2026-08-13. This file REPLACES a 2026-05-04 bulk-sweep scaffold that invented
  per-minute and per-month tiered quotas and X-RateLimit-* headers CleverTap does
  not publish. The real model is different in kind: CleverTap throttles on
  CONCURRENCY (parallel in-flight requests per account), not on a time window,
  and says so explicitly — "CleverTap does not enforce rate limits based on
  specific time frames (minute, hour, or day)". Limits are per user account and
  per API, and do not vary by pricing tier.
model:
  type: concurrency
  scope: per-account-per-api
  time_windowed: false
  varies_by_plan: false
  quota: none-published
  overage: none-published
  provider_statement: >-
    "CleverTap does not enforce rate limits based on specific time frames
    (minute, hour, or day), making our APIs more accessible."
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    NO RATE-LIMIT RESPONSE HEADERS ARE DOCUMENTED. CleverTap publishes no
    X-RateLimit-*, RateLimit-* or Retry-After contract for its REST API, so an
    agent has no runtime signal of remaining headroom and must infer exhaustion
    from the 429 status alone. This is a real gap, recorded as an honest null
    rather than a guessed header set.
responseCodes:
  throttled: 429
  throttled_message: Too many concurrent requests
  quotaExceeded: null
  serviceUnavailable: 503
limit_count: 23
