    version: Unity 5.5.4
    url: https://github.com/CleverTap/clevertap-unity-sdk/releases/tag/5.5.4
    additions:
      - 'App Inbox on-demand fetch: FetchInbox() triggers a server refresh, throttled to once every 5 minutes.'
      - 'Unmute (Android): Unmute() resumes SDK event tracking and network operations immediately.'
      - Updated to CleverTap Android SDK v8.3.0 and iOS SDK v7.7.1.
    fixes:
      - OnUserLogin no longer silently drops profile properties passed when switching users.
    breaking:
      - >-
        Minimum supported Android API level is now 23 (required by CleverTap
        Android SDK v8.1.0 and above); apps targeting API 22 or below cannot
        integrate this version.
