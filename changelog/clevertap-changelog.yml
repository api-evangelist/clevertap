      - 'Silent-in-foreground push via the wzrk_sif:true payload key (iOS), server-controlled.'
      - 'New Web API getVariants() returns the current user''s A/B test variants.'
      - 'New APIs fetchInbox() and fetchInboxWithCallback() for on-demand inbox refresh.'
