  and confirmed against each package registry's metadata endpoint (npm registry,
  Maven Central maven-metadata.xml, CocoaPods trunk, pub.dev) or, where the
  library is distributed only from GitHub, against the repository's latest
  release tag. CleverTap publishes no PyPI, RubyGems, NuGet, crates.io or
  pkg.go.dev package; the Python and Ruby entries on its SDK page are example
  repositories and a community wrapper, recorded here as official:false.
