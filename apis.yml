description: >-
  CleverTap is a customer engagement and retention platform that helps businesses understand user behavior, segment
  audiences, and deliver personalized experiences across mobile push, email, SMS, in-app, web push, and WhatsApp
  channels. CleverTap exposes a comprehensive REST API surface covering profiles, events, campaigns, real-time
  analytics, catalogs, feature flags, and more, authenticated via account ID and passcode headers.
