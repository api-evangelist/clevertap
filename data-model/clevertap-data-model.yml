description: >-
  Entity-relationship graph for the CleverTap REST API, derived from the request
  and response schemas in this repo's OpenAPI and cross-checked against the
  provider's object-reference pages. CleverTap's specs are schema-light (most
  request bodies are declared `type: object` with no properties), so
  relationships here come from the identifier fields the operations actually
  carry rather than from $ref chains.
identifiers:
  - field: identity
    description: >-
      The customer's own user identifier (email, phone, customer ID). The primary
      cross-system join key.
    scope: profile
  - field: objectId
    description: >-
      The CleverTap-generated device/user identifier (CleverTap ID). Present on
      webhook payloads as `ObjectId`.
    scope: profile
    format: opaque string, commonly prefixed with '-' or '__'
  - field: FBID
    description: Facebook identifier used as an alternate profile key.
    scope: profile
  - field: GPID
    description: Google Plus identifier used as an alternate profile key.
    scope: profile
  - field: req_id
    description: >-
      Handle returned by campaign creation; passed to GET /1/targets/result.json
      to retrieve the campaign report. A job handle, not a durable resource id.
    scope: campaign
  - field: targetId
    description: The campaign identifier, delivered on every webhook payload.
    scope: campaign
entities:
  - name: Profile
    description: >-
      A unified user record holding identity keys, demographic properties and
      arbitrary custom properties.
    keys:
      - identity
      - objectId
      - FBID
      - GPID
    fields:
      - name: profileData
        type: object
