relationships:
  - from: Event
    to: Profile
    type: belongs_to
    via: identity | objectId | FBID | GPID
    note: >-
      Every event is attributed to exactly one profile through one of the four
      identity keys. A record missing all of them fails with application code 523
      (Missing identity).
  - from: Profile
    to: Event
    type: has_many
    via: identity
  - from: Profile
    to: DeviceToken
    type: has_many
    via: objectId
    note: Application code 530 (Invalid 'objectId') is the failure mode on a bad binding.
  - from: Campaign
    to: Segment
    type: belongs_to
    via: segment
  - from: Campaign
    to: Profile
    type: has_many
    via: where / segment
    note: >-
      The audience is resolved at send time from the CQL expression in `where` or
      from a named segment; there is no stored campaign-to-profile join to read.
  - from: CampaignReport
    to: Campaign
    type: belongs_to
    via: req_id
  - from: Count
    to: Event
    type: belongs_to
    via: event name
  - from: Count
    to: Profile
    type: belongs_to
    via: profile property
  - from: WebhookPayload
    to: Campaign
    type: belongs_to
    via: targetId
    note: See asyncapi/clevertap-webhooks.yml for the payload shapes.
  - from: WebhookPayload
    to: Profile
    type: has_many
    via: profiles[]
polymorphic_ingestion:
  endpoint: /1/upload
  discriminator: type
  values:
    - profile
    - event
  note: >-
    A single endpoint ingests both entities; each record in the `d` array
    declares its own `type`. A record whose type is neither fails with
    application code 524 (Data neither event nor profile). Max 1000 records per
    call.
