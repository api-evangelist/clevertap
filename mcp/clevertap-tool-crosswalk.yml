generated: '2026-08-13'
method: derived
source: mcp/clevertap-mcp.yml + openapi/ + https://developer.clevertap.com/docs/api-reference
description: >-
  Crosswalk between the CleverTap agent surface and its REST contract. CleverTap
  runs a real remote MCP server (mcp.clevertap.com) but the server is
  OAuth-gated: tools/list returns 401 anonymously and no tool list is published
  in the docs or in llms.txt. There is therefore NO published tool inventory to
  bind. Rather than guess tool names, this crosswalk records the divergence
  honestly: the crosswalk[] table is empty, and rest_only[] enumerates the REST
  operations an agent would need bound.

surfaces:
  openapi:
    files:
      - openapi/clevertap-profiles-api-openapi.yml
      - openapi/clevertap-events-api-openapi.yml
      - openapi/clevertap-campaigns-api-openapi.yml
      - openapi/clevertap-reports-api-openapi.yml
      - openapi/_original/clevertap-openapi.yml
    gated: false
    note: >-
      No OpenAPI is published by CleverTap at any probed location. The specs in
      this repo were authored by API Evangelist from the public REST reference at
      developer.clevertap.com. They cover 10 of the documented operations; the
      documented REST reference is broader (catalog, custom list, remote config,
      settings, content blocks, promos, wallet, coupon, token vault, SCIM).
  graphql:
    endpoint: null
    gated: null
    note: >-
      No GraphQL surface. POST /graphql on api.clevertap.com and
      us1.api.clevertap.com both return HTTP 405 "HTTP method POST is not
      supported by this URL".
  mcp:
    url: https://mcp.clevertap.com/mcp
    gated: true
    note: >-
      tools/list returns HTTP 401 with a WWW-Authenticate Bearer challenge. Tool
      names and inputSchemas require authenticated introspection.

crosswalk: []

